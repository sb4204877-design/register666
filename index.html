<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Subscription Plans</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #ffafbd, #ffc3a0);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }
    .plans-container {
      display: flex;
      gap: 8px;
      justify-content: center;
      align-items: center;
    }
    .plan-card {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 8px;
      padding: 10px;
      width: 110px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      position: relative;
      font-size: 9px;
      line-height: 1.3;
      border: 1px solid rgba(255,255,255,0.3);
    }
    .plan-card.free {
      border-top: 2px solid #4CAF50;
    }
    .plan-card.premium {
      border-top: 2px solid #FFD700;
    }
    .plan-card.custom {
      width: 120px;
      transform: scale(1.05);
      z-index: 10;
      background: rgba(255, 255, 255, 0.3);
      border: 1px solid #FFD700;
      position: relative;
    }
    .custom-badge {
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%) rotate(-12deg);
      background: #FFD700;
      color: #000;
      padding: 1px 5px;
      border-radius: 3px;
      font-weight: bold;
      font-size: 8px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }
    .plan-card h3 {
      font-size: 10px;
      margin: 3px 0 2px;
      font-weight: bold;
    }
    .features {
      margin: 2px 0;
    }
    .feature {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 2px;
      margin: 1px 0;
      color: #333;
      font-size: 9px;
    }
    .feature i {
      font-size: 9px;
    }
    .price {
      margin-top: 2px;
      font-weight: bold;
      color: #d32f2f;
      font-size: 9px;
    }
    .label {
      position: absolute;
      top: 6px;
      left: 6px;
      font-size: 7px;
      padding: 1px 4px;
      border-radius: 8px;
      font-weight: bold;
      color: white;
    }
    .label.free {
      background: #4CAF50;
    }
    .label.gold {
      background: #FF9800;
    }
  </style>
</head>
<body>
  <div class="plans-container">
    <!-- الخطة المجانية -->
    <div class="plan-card free">
      <div class="label free">Free</div>
      <h3>Free Plan</h3>
      <div class="features">
        <div class="feature"><i class="fas fa-user"></i> 20</div>
        <div class="feature"><i class="fas fa-heart"></i> 20</div>
      </div>
      <div class="price">One-time</div>
    </div>

    <!-- الخطة المخصصة (في المنتصف) -->
    <div class="plan-card custom">
      <div class="custom-badge"><i class="fas fa-crown" style="font-size:8px;"></i></div>
      <h3>Custom Plan</h3>
      <div class="features">
        <div class="feature"><i class="fas fa-user"></i> 500+</div>
        <div class="feature"><i class="fas fa-heart"></i> 500+</div>
      </div>
      <div class="price">$1.49 / 500<br>$1.00 / 500</div>
    </div>

    <!-- الخطة الذهبية -->
    <div class="plan-card premium">
      <div class="label gold">Gold</div>
      <h3>Premium</h3>
      <div class="features">
        <div class="feature"><i class="fas fa-user"></i> 100K</div>
        <div class="feature"><i class="fas fa-heart"></i> 100K</div>
      </div>
      <div class="price">$179.98</div>
    </div>
  </div>
</body>
</html>
